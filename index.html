<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#050508"/>
  <title>PBF POS</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;width:100%;overflow:hidden}
    body{font-family:system-ui,-apple-system,sans-serif;background:#050508}
    #root{height:100vh;width:100%;overflow:hidden}
    ::-webkit-scrollbar{display:none}
    *{scrollbar-width:none;-ms-overflow-style:none}
    #splash{position:fixed;inset:0;background:#050508;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999;transition:opacity .5s}
  </style>
</head>
<body>
  <div id="splash">
    <div style="font-size:52px">&#x1F48E;</div>
    <div style="color:#C9A84C;font-weight:900;font-size:24px;letter-spacing:4px">PBF POS</div>
    <div style="color:#555;font-size:11px;letter-spacing:2px">PERFECT BODYFLEX &times; MCNC</div>
    <div id="splash-msg" style="color:#333;font-size:11px;margin-top:8px">Chargement...</div>
  </div>
  <div id="root"></div>
  <script src="app.js"></script>
</body>
</html>
