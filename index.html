<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="theme-color" content="#050508"/>
  <title>PBF POS</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{height:100%;width:100%;overflow:hidden}
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;background:#050508}
    #root{height:100vh;width:100%;overflow:hidden}
    ::-webkit-scrollbar{display:none}
    *{scrollbar-width:none;-ms-overflow-style:none}
    #splash{position:fixed;inset:0;background:#050508;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999}
    #splash-gem{font-size:52px}
    #splash-title{color:#C9A84C;font-weight:900;font-size:24px;letter-spacing:4px}
    #splash-sub{color:#555;font-size:11px;letter-spacing:2px}
    #splash-load{color:#333;font-size:11px;margin-top:8px}
  </style>
</head>
<body>
  <div id="splash">
    <div id="splash-gem">&#x1F48E;</div>
    <div id="splash-title">PBF POS</div>
    <div id="splash-sub">PERFECT BODYFLEX &times; MCNC</div>
    <div id="splash-load">Chargement...</div>
  </div>
  <div id="root"></div>
  <script>
    window.addEventListener('error', function(e){
      document.getElementById('splash-load').textContent = 'Erreur: ' + e.message;
      document.getElementById('splash-load').style.color = '#f87171';
    });
  </script>
  <script src="app.js" defer></script>
</body>
</html>
